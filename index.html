<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script>
  </head>
  <body>
    <!-- Ex 1 -->
    <a-scene arjs>
      <!-- Plan servant de surface de base au centre (0, 0, 0) -->
      <a-plane position="0 0 0" rotation="-90 0 0" width="10" height="10" color="#7BC8A4"></a-plane>

      <!-- Trois boîtes flottant -->
      <a-box position="-3 2 0" color="#4CC3D9"></a-box>
      <a-box position="0 2 0" color="#EF2D5E"></a-box>
      <a-box position="3 2 0" color="#FFC65D"></a-box>

      <!-- Camera orientée vers le centre -->
      <a-entity position="0 10 10" rotation="-30 0 0">
        <a-camera></a-camera>
      </a-entity>

      <a-sky color="#ECECEC"></a-sky>
    </a-scene>

    <!-- Ex 2 -->
  </body>
</html>
