<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script>
  </head>
  <body>
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">


    <!-- Ex 1 -->
      <a-plane position="0 0 0" rotation="-90 0 0" width="10" height="10" color="#7BC8A4"></a-plane>

      <a-box position="-3 2 0" color="#4CC3D9"></a-box>
      <a-box position="0 2 0" color="#EF2D5E"></a-box>
      <a-box position="3 2 0" color="#FFC65D"></a-box>

      <a-entity position="0 10 15" rotation="-30 0 0">
        <a-camera></a-camera>
      </a-entity> 
    

      <a-sky color="#ECECEC"></a-sky>

    <!-- Ex 2 -->
      <a-marker preset="hiro">
        <a-box 
          position="10 0 0"
          scale="5 5 5"
          material="color: #4CC3D9; transparent: true; opacity: 0.6;"
          animation="property: rotation; to: 0 360 0; loop: true; dur: 4000; easing: linear">
        </a-box>
      </a-marker>
    </a-scene>
  </body>
</html>
